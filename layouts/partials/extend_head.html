{{- if or .Params.math .Site.Params.math }}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rF/h1yV2RtEMvk/4HVh" crossorigin="anonymous"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
    renderMathInElement(document.body, {
        delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "\\[", right: "\\]", display: true },
            { left: "$", right: "$", display: false },
            { left: "\\(", right: "\\)", display: false }
        ],
        throwOnError: false
    });
});
</script>
{{- end }}

<script>
    (function () {
        var html = document.documentElement;
        var defaults = {
            "code-theme": "ink",
            "ui-font": "system",
            "code-font": "system",
            "content-width": "1040"
        };

        function storageGet(key) {
            try {
                var value = localStorage.getItem(key);
                if (key === "pref-code-font" && value === "jetbrains" && !localStorage.getItem("pref-v2")) {
                    return null;
                }
                return value;
            } catch (error) {
                return null;
            }
        }

        Object.keys(defaults).forEach(function (key) {
            var value = storageGet("pref-" + key) || defaults[key];
            if (key === "content-width") {
                html.style.setProperty("--reader-width", value + "px");
                return;
            }
            var dataKey = key.replace(/-([a-z])/g, function (_, letter) {
                return letter.toUpperCase();
            });
            html.dataset[dataKey] = value;
        });
    })();
</script>
