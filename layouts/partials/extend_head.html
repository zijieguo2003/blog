{{- if or .Params.math .Site.Params.math }}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
        onload="renderMathInElement(document.body, {
            delimiters: [
                { left: '$$', right: '$$', display: true },
                { left: '\\[', right: '\\]', display: true },
                { left: '$', right: '$', display: false },
                { left: '\\(', right: '\\)', display: false }
            ],
            throwOnError: false,
            strict: 'ignore'
        });"></script>
{{- end }}

<script>
    (function () {
        var html = document.documentElement;
        var defaults = {
            "code-theme": "ink",
            "ui-font": "system",
            "code-font": "system",
            "content-width": "1040"
        };

        function storageGet(key) {
            try {
                var value = localStorage.getItem(key);
                if (key === "pref-code-font" && value === "jetbrains" && !localStorage.getItem("pref-v2")) {
                    return null;
                }
                return value;
            } catch (error) {
                return null;
            }
        }

        Object.keys(defaults).forEach(function (key) {
            var value = storageGet("pref-" + key) || defaults[key];
            if (key === "content-width") {
                html.style.setProperty("--reader-width", value + "px");
                return;
            }
            var dataKey = key.replace(/-([a-z])/g, function (_, letter) {
                return letter.toUpperCase();
            });
            html.dataset[dataKey] = value;
        });
    })();
</script>
